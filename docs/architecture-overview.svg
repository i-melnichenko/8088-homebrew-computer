<svg xmlns="http://www.w3.org/2000/svg" width="860" height="360" viewBox="0 0 860 360" role="img" aria-labelledby="title description">
  <title id="title">8088 Homebrew Computer architecture</title>
  <desc id="description">The 8088 mainboard connects through two 5 volt TTL expansion slots to a display module and a Smart I/O module.</desc>
  <style>
    .card { fill: #f8fafc; stroke: #334155; stroke-width: 2; }
    .accent { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; }
    .module { fill: #f0fdf4; stroke: #16a34a; stroke-width: 2; }
    .line { fill: none; stroke: #475569; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .title { fill: #0f172a; font: 700 22px system-ui, sans-serif; text-anchor: middle; }
    .label { fill: #334155; font: 15px system-ui, sans-serif; text-anchor: middle; }
    .small { fill: #475569; font: 13px system-ui, sans-serif; text-anchor: middle; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#475569"/>
    </marker>
  </defs>

  <rect class="accent" x="190" y="24" width="480" height="104" rx="14"/>
  <text class="title" x="430" y="61">8088 mainboard</text>
  <text class="label" x="430" y="88">CPU · RAM · ROM · PIC · PIT · UART</text>
  <text class="small" x="430" y="111">Clock · decoders · power</text>

  <path class="line" d="M430 128 V183" marker-end="url(#arrow)"/>
  <text class="label" x="430" y="158">Exp0 / Exp1 · 5 V TTL</text>
  <path class="line" d="M430 203 V220 H190 V246" marker-end="url(#arrow)"/>
  <path class="line" d="M430 203 V220 H670 V246" marker-end="url(#arrow)"/>

  <rect class="module" x="45" y="246" width="290" height="88" rx="14"/>
  <text class="title" x="190" y="281">Display Module</text>
  <text class="label" x="190" y="308">HD44780 character LCD</text>

  <rect class="module" x="525" y="246" width="290" height="88" rx="14"/>
  <text class="title" x="670" y="281">Smart I/O Module</text>
  <text class="label" x="670" y="308">ESP32-S3 · TFT · microSD</text>
</svg>
